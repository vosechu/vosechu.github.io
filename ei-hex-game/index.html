<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrow Puzzle</title>
<style>
  :root {
    --p: min(12.5vw, 8.8vh);   /* distance between adjacent tile centres */
    --bg: #2f2f2f;
    --ink: #ececec;
    --dim: #a9a9a9;
    --line: #575757;
    --warm: #9a9a9a;
    --gold: #f2c879;           /* warm: finished */
    --cue: #8fd0e0;            /* cool: do this next */
    --display: Georgia, "Times New Roman", serif;
    --data: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.22, 1.4, .36, 1);   /* quick off the mark, slight overshoot */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 0 1rem 2rem;
    background: radial-gradient(ellipse 70% 60% at 50% 34%, #3d3d3d 0%, var(--bg) 62%, #262626 100%);
    color: var(--ink);
    font-family: var(--display); text-align: center;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-weight: 400; font-size: clamp(1.7rem, 5.5vw, 2.5rem); margin: 1.1rem 0 .3rem; }
  .hint { max-width: 27em; margin: 0 auto .8rem; color: var(--dim); font-size: .95rem; }

  /* ---- readout ---- The clock leads; best and moves are reference. Mono and
     lowercase rather than the usual letterspaced caps, because this is a
     speedcuber's workbench and its numbers should read like an instrument. */
  .stats { display: flex; justify-content: center; gap: clamp(1rem, 4vw, 2.4rem); margin: 0 auto .9rem; }
  .stat dt { font-family: var(--data); font-size: .68rem; color: var(--dim); }
  .stat dd { display: inline-block; margin: .2rem 0 0; font-family: var(--data); font-variant-numeric: tabular-nums; }
  #clock { min-width: 9ch; font-size: clamp(1.3rem, 4.6vw, 1.8rem); }
  #best { min-width: 9ch; font-size: clamp(.9rem, 3vw, 1.1rem); color: var(--dim); }
  #moves { min-width: 3ch; font-size: clamp(.9rem, 3vw, 1.1rem); color: var(--dim); }

  /* ---- board ----
     37 flat-top hexes tile into one pointy-top hexagon. A hexagon of hexagons is
     always turned 30 degrees from its own tiles, so tiles flat-topped and board
     pointy-topped is the only pairing that matches the reference screenshots.
     Bounding box is 6.36 x 7 pitches. */
  #board { position: relative; width: calc(6.36 * var(--p)); height: calc(7 * var(--p)); margin: 0 auto; }

  /* A flat-top hex of pitch P measures 2P/sqrt(3) across the points by P across
     the flats. clip-path trims the button to that hex so neighbouring tiles,
     whose rectangles overlap at the corners, can't steal each other's clicks. */
  .tile {
    --turn: 0;
    position: absolute; left: 50%; top: 50%;
    width: calc(1.1547 * var(--p)); height: var(--p);
    transform: translate(-50%, -50%)
               translate(calc(var(--x) * var(--p)), calc(var(--y) * var(--p)));
    padding: 0; border: 0; background: none;
    clip-path: polygon(0% 50%, 25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%);
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }

  /* The hex is drawn a touch inside the clip so its stroke survives, which also
     leaves the hairline seam between tiles that the screenshots have.
     Two stacked SVGs: a still hexagon and a spinning arrow. pointer-events stay off
     so the clip-path above is the only hit area. */
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cell {
    fill: transparent; stroke: var(--line); stroke-width: 2.5;
    transition: fill .18s ease, stroke .18s ease, stroke-width .18s ease;
  }
  .tile.warm .cell { fill: rgba(255, 255, 255, .05); stroke: var(--warm); }
  .tile:active .cell { fill: rgba(255, 255, 255, .11); }
  .tile:focus-visible { outline: none; }
  /* Outscopes .tile.cued below on purpose: a cued tile must still show it has focus. */
  #board .tile:focus-visible .cell { stroke: #cfe0f2; stroke-width: 7; }

  /* Only the arrow turns. Spinning the hexagon too looks identical at rest, since a
     regular hexagon is unchanged by a sixth of a turn, but halfway through the tween
     it sits at 30 degrees with its corners past the clip-path, so the outline gets
     sliced along the seams it shares with its neighbours.
     The rotation goes on a root <svg>, which is the one SVG element that centres its
     own transform-origin. Rotating the <path> instead needs transform-box, whose
     reference box starts at user-space 0,0 rather than at the viewBox corner, so
     50% 50% lands half a tile away and flings the arrow out of the clip. */
  .spin {
    transform: rotate(calc(var(--turn) * 60deg));
    transition: transform .26s var(--ease) var(--delay, 0ms);
  }
  .arrow {
    --stroke-delay: 0ms;
    fill: none; stroke: var(--ink); stroke-width: 12;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke .45s ease var(--stroke-delay);
  }

  /* Instant repaint for scrambles and resets: no spin from the old state. */
  #board.no-tween .spin { transition: none; }

  /* ---- the cue ---- Taps commute, so the hint is a set, not a sequence. Every tile
     that needs a tap lights at once. The count only shows when it is more than one,
     since the highlight already says "tap this". */
  .cue {
    position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
    font-family: var(--data); font-size: calc(var(--p) * .19); line-height: 1;
    color: var(--cue); pointer-events: none;
  }
  .tile.cued .cell { stroke: var(--cue); stroke-width: 4; fill: rgba(143, 208, 224, .07); }

  /* ---- solved: a glow rippling out from the centre ---- */
  #board.solved .cell {
    animation: flare 1.5s ease-out both;
    animation-delay: calc(var(--dist) * 130ms);
  }
  /* Delays the stroke only. Overriding transition-delay here would also delay the
     turn, which would stall the winning move's own rotation. */
  #board.solved .arrow { stroke: var(--gold); --stroke-delay: calc(var(--dist) * 130ms); }
  @keyframes flare {
    35% { fill: rgba(242, 200, 121, .34); stroke: var(--gold); stroke-width: 4; }
    100% { fill: rgba(242, 200, 121, .1); stroke: rgba(242, 200, 121, .55); stroke-width: 2.5; }
  }

  /* One status line, one job: say where play stands. */
  .status {
    margin: .9rem auto 0; height: 1.6rem; font-size: 1.15rem;
    opacity: 0; transition: opacity .3s ease;
  }
  .status.show { opacity: 1; }
  .status.won { color: var(--gold); transition-delay: .5s; }
  .status.helped { color: var(--dim); font-size: 1rem; }
  .status.cueing { color: var(--cue); font-family: var(--data); font-size: .95rem; }

  /* ---- controls ---- */
  .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: .6rem; margin: .7rem auto 0; }
  .controls button {
    font-family: inherit; font-size: .95rem; padding: .5rem 1.1rem;
    color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; transition: border-color .18s ease, background-color .18s ease, color .18s ease;
  }
  .controls button:hover:enabled { border-color: var(--warm); background: rgba(255, 255, 255, .05); }
  .controls button:disabled { color: #6d6d6d; cursor: default; }
  #cueing[aria-pressed="true"] { color: var(--cue); border-color: var(--cue); }

  /* ---- algorithm sheet ---- Mini boards reuse the tile machinery by giving each one
     its own --p, so nothing about the geometry is duplicated. */
  /* Visibility is the hidden attribute alone, so there is one source of truth. */
  .sheet { max-width: 62rem; margin: 2.6rem auto 0; }
  .sheet h2 { font-weight: 400; font-size: 1.35rem; margin: 0 0 .4rem; }
  .sheet { scroll-margin-top: 1rem; }
  .sheet > p { color: var(--dim); font-size: .95rem; max-width: 40em; margin: 0 auto 1.8rem; }
  .sheet h3 {
    font-family: var(--data); font-weight: 400; font-size: .82rem; color: var(--cue);
    margin: 2rem 0 1rem; padding-bottom: .4rem; border-bottom: 1px solid var(--line);
  }
  .algos { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 2rem 1.4rem; }
  .algo { margin: 0; }
  .pair { display: flex; justify-content: center; gap: .5rem; }
  .mini { --p: 20px; position: relative; width: calc(6.36 * var(--p)); height: calc(7 * var(--p)); }
  .mini .tile { cursor: default; }
  .mini .cell { stroke-width: 4; }
  .mini .cue { font-size: calc(var(--p) * .5); bottom: 20%; }
  .mini .off .cell { stroke: var(--ink); }
  .algo figcaption { margin-top: .7rem; font-family: var(--data); font-size: .76rem; color: var(--dim); }
  .algo b { color: var(--ink); font-weight: 400; }

  @media (prefers-reduced-motion: reduce) {
    .spin, .arrow { transition-duration: 1ms; }
    #board.solved .cell {
      animation: none; fill: rgba(242, 200, 121, .1); stroke: rgba(242, 200, 121, .55);
    }
    .status { transition: none; }
  }
</style>
</head>
<body>

<h1>Arrow Puzzle</h1>
<p class="hint">Make all arrows point upward by tapping tiles. Each tap turns the tile and its neighbours a sixth of a turn clockwise.</p>

<dl class="stats">
  <div class="stat"><dt>time</dt><dd id="clock">00:00.000</dd></div>
  <div class="stat"><dt>best</dt><dd id="best">&ndash;</dd></div>
  <div class="stat"><dt>moves</dt><dd id="moves">0</dd></div>
</dl>

<div id="board"></div>
<p class="status" id="status" role="status"></p>

<div class="controls">
  <button type="button" id="cueing" aria-pressed="false">Show solution</button>
  <button type="button" id="undo" disabled>Undo</button>
  <button type="button" id="reset">Reset to solved</button>
  <button type="button" id="fresh">New puzzle</button>
  <button type="button" id="sheeting" aria-pressed="false" aria-controls="sheet">Algorithm sheet</button>
  <button type="button" id="clearbest">Reset best time</button>
</div>

<section class="sheet" id="sheet" hidden></section>

<script>
'use strict';

/* ===================== game logic (knows nothing about the DOM) ===================== */

const RADIUS = 3;                                    // 3n^2 - 3n + 1 = 37 tiles at side n = 4
const STEPS = 6;                                     // sixths of a turn
const NEIGHBOURS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

// Axial coordinates of every tile in a hexagon of hexagons.
const cells = [];
for (let q = -RADIUS; q <= RADIUS; q++) {
  for (let r = -RADIUS; r <= RADIUS; r++) {
    if (Math.abs(q + r) <= RADIUS) cells.push({ q, r });
  }
}

const tileAt = new Map(cells.map((c, i) => [c.q + ',' + c.r, i]));

// Tapping a tile turns it plus whichever of its six neighbours exist. Index 0 is
// always the tapped tile itself, which the ripple animation relies on.
const groups = cells.map(c =>
  [[0, 0]].concat(NEIGHBOURS)
    .map(d => tileAt.get((c.q + d[0]) + ',' + (c.r + d[1])))
    .filter(i => i !== undefined));

// Rings out from the centre, for the solved animation.
const distanceOf = c => (Math.abs(c.q) + Math.abs(c.r) + Math.abs(c.q + c.r)) / 2;

// The board's twelve symmetries. Both generators permute the three constraints that
// define the board (|q|, |r|, |q+r| all at most 3), so both map it exactly onto itself.
const rotate = c => ({ q: -c.r, r: c.q + c.r });        // a sixth turn; cubes to negation
const reflect = c => ({ q: c.r, r: c.q });

// The twelve symmetries as index permutations: rotations r^k, and their mirrors s·r^k.
const SYMMETRIES = [];
for (let k = 0; k < 6; k++) {
  for (const mirrored of [false, true]) {
    SYMMETRIES.push(cells.map(c => {
      let image = c;
      for (let n = 0; n < k; n++) image = rotate(image);
      if (mirrored) image = reflect(image);
      return tileAt.get(image.q + ',' + image.r);
    }));
  }
}

// Two positions are the same puzzle if a symmetry carries one to the other, so name a
// position by the smallest of its twelve images. Keeps the sheet free of duplicates.
function canonicalPattern(s) {
  let best = null;
  for (const perm of SYMMETRIES) {
    const image = new Array(s.length).fill(0);
    for (let i = 0; i < s.length; i++) image[perm[i]] = s[i];
    const key = image.join(',');
    if (best === null || key < best) best = key;
  }
  return best;
}

// Cumulative sixth-turns clockwise per tile. Orientation is turns % 6; solved is all 0.
// Counting up forever instead of wrapping keeps CSS rotating the short way at the seam.
const turns = cells.map(() => 0);
const taps = [];

const mod = (v, m) => ((v % m) + m) % m;
const isSolved = () => turns.every(t => mod(t, STEPS) === 0);

function turn(i, direction) {
  for (const j of groups[i]) turns[j] += direction;
}

// Replaying real taps keeps the scramble inside the group the taps generate, so
// every puzzle is solvable. Randomising each tile independently would not be.
function scramble(count) {
  for (let k = 0; k < count; k++) turn(Math.floor(Math.random() * cells.length), 1);
}

/* ===================== solver ===================== */

// Taps commute and each has order 6, so a solution is not a sequence: it is a count
// of taps per tile, applied in any order. Finding it means solving A x = -s over Z/6,
// where A[j][i] is 1 when tapping i turns j. Z/6 splits as Z/2 x Z/3, so solve mod 2
// and mod 3 by exact Gaussian elimination and recombine with the remainder theorem.
// No floating point and no search anywhere in here.

const MATRIX = cells.map((c, j) => cells.map((d, i) => (groups[i].indexOf(j) === -1 ? 0 : 1)));

function inversesModP(p) {
  const inv = [0];
  for (let a = 1; a < p; a++) {
    for (let b = 1; b < p; b++) if (a * b % p === 1) inv[a] = b;
  }
  return inv;
}

// Reduced row echelon form. Returns one solution plus a basis of A's kernel, which is
// every tap-combination that does nothing at all.
function solveModP(rhs, p) {
  const n = MATRIX.length;
  const inv = inversesModP(p);
  const a = MATRIX.map((row, r) => row.concat(rhs[r]).map(v => mod(v, p)));
  const pivotRow = new Array(n).fill(-1);
  let row = 0;

  for (let col = 0; col < n && row < n; col++) {
    let found = -1;
    for (let r = row; r < n; r++) if (a[r][col]) { found = r; break; }
    if (found === -1) continue;
    const swap = a[row]; a[row] = a[found]; a[found] = swap;
    const scale = inv[a[row][col]];
    for (let c = col; c <= n; c++) a[row][c] = a[row][c] * scale % p;
    for (let r = 0; r < n; r++) {
      if (r === row || !a[r][col]) continue;
      const f = a[r][col];
      for (let c = col; c <= n; c++) a[r][c] = (a[r][c] - f * a[row][c] % p + p) % p;
    }
    pivotRow[col] = row;
    row++;
  }

  for (let r = row; r < n; r++) if (a[r][n]) return null;      // inconsistent

  const particular = new Array(n).fill(0);
  const basis = [];
  for (let col = 0; col < n; col++) {
    if (pivotRow[col] !== -1) { particular[col] = a[pivotRow[col]][n]; continue; }
    const v = new Array(n).fill(0);
    v[col] = 1;
    for (let c = 0; c < n; c++) if (pivotRow[c] !== -1) v[c] = (p - a[pivotRow[c]][col]) % p;
    basis.push(v);
  }
  return { particular, basis, p };
}

function* coset(sol) {
  const total = Math.pow(sol.p, sol.basis.length);
  for (let pick = 0; pick < total; pick++) {
    const x = sol.particular.slice();
    let rest = pick;
    for (const v of sol.basis) {
      const k = rest % sol.p;
      rest = Math.floor(rest / sol.p);
      if (k) for (let i = 0; i < x.length; i++) x[i] = (x[i] + k * v[i]) % sol.p;
    }
    yield x;
  }
}

// x == a (mod 2) and x == b (mod 3). Write x = a + 2t, then 2t == b - a (mod 3),
// and 2 is its own inverse mod 3, so t == 2(b - a) (mod 3).
const combine = (a, b) => a.map((v, i) => v + 2 * mod(2 * (b[i] - v), 3));

function applyPlan(state, plan) {
  const after = state.slice();
  plan.forEach((count, i) => {
    for (let k = 0; k < count; k++) for (const j of groups[i]) after[j] = (after[j] + 1) % STEPS;
  });
  return after;
}

// A's kernel is every tap-combination that does nothing at all. Measured once, because
// it settles two separate questions: how many solutions a position has, and which
// positions have any. Dimensions are 4 mod 2 and 5 mod 3 on this board.
const KERNEL_2 = solveModP(cells.map(() => 0), 2).basis;
const KERNEL_3 = solveModP(cells.map(() => 0), 3).basis;

// Every solvable position has exactly this many solutions: 2^4 * 3^5 = 3888.
const SOLUTION_COUNT = Math.pow(2, KERNEL_2.length) * Math.pow(3, KERNEL_3.length);
// True when a symmetry maps a vector onto itself.
function fixedBy(v, perm) {
  for (let i = 0; i < v.length; i++) if (v[perm[i]] !== v[i]) return false;
  return true;
}

// Equally short solutions are equally correct, so among them prefer one that shares the
// position's own symmetry: a symmetric algorithm is far easier to hold in your head.
// Since A(g.x) = g.(A x), any symmetry fixing the position carries a solution to another
// solution of the same length, so a symmetric choice is usually available. Falls back to
// the lexicographically smallest, which at least makes the pick deterministic rather
// than "whichever one the enumeration happened to reach first".
function mostSymmetric(candidates, state) {
  const stabiliser = SYMMETRIES.filter(perm => fixedBy(state, perm));
  let best = null;
  let bestScore = -1;
  let bestKey = null;
  for (const x of candidates) {
    let score = 0;
    for (const perm of stabiliser) if (fixedBy(x, perm)) score++;
    const key = x.join(',');
    if (score > bestScore || (score === bestScore && key < bestKey)) {
      best = x; bestScore = score; bestKey = key;
    }
  }
  return best;
}

const MAX_CANDIDATES = 4096;
// 3888 fits under the cap, so the search below really does see every solution and its
// answer is the true minimum rather than the best of a sample.
const PROVABLY_FEWEST = SOLUTION_COUNT <= MAX_CANDIDATES;

// A is symmetric, so image(A) is the orthogonal complement of ker(A). That makes
// solvability nine dot products rather than a full elimination, which is what lets the
// sheet below test a million candidate positions.
const KERNEL_COLUMN = cells.map((c, i) => ({
  two: KERNEL_2.map(v => v[i]),
  three: KERNEL_3.map(v => v[i]),
}));

function patternReachable(support, values) {
  for (let b = 0; b < KERNEL_2.length; b++) {
    let dot = 0;
    for (let k = 0; k < support.length; k++) dot += values[k] * KERNEL_COLUMN[support[k]].two[b];
    if (dot % 2) return false;
  }
  for (let b = 0; b < KERNEL_3.length; b++) {
    let dot = 0;
    for (let k = 0; k < support.length; k++) dot += values[k] * KERNEL_COLUMN[support[k]].three[b];
    if (dot % 3) return false;
  }
  return true;
}

// The smallest positions that can be solved at all. These are the endgame cases worth
// memorising, and they are what a single-tile algorithm would be if one existed: it
// cannot, because A is not surjective, so nothing isolates one tile.
// Solvable positions grouped by how many tiles are wrong, one group per requested size.
// Two independent stops, both reported rather than hidden: `limit` distinct cases per
// size, and a shared budget of reachability tests so the button can never hang. A group
// is complete only when neither stop fired, and the sheet says so either way.
function findPatterns(sizes, limit, budget) {
  let spent = 0;
  return sizes.map(size => {
    const found = new Map();
    const support = new Array(size);
    const values = new Array(size);
    let capped = false;
    let overBudget = false;

    const stop = () => capped || overBudget;

    const walkValues = k => {
      if (stop()) return;
      if (k === size) {
        if (++spent > budget) { overBudget = true; return; }
        if (!patternReachable(support, values)) return;
        const s = cells.map(() => 0);
        for (let j = 0; j < size; j++) s[support[j]] = values[j];
        const key = canonicalPattern(s);
        if (!found.has(key)) {
          found.set(key, s);
          if (found.size >= limit) capped = true;
        }
        return;
      }
      for (let v = 1; v < STEPS && !stop(); v++) { values[k] = v; walkValues(k + 1); }
    };

    const walkSupport = (from, k) => {
      if (stop()) return;
      if (k === size) { walkValues(0); return; }
      for (let pos = from; pos < cells.length && !stop(); pos++) {
        support[k] = pos;
        walkSupport(pos + 1, k + 1);
      }
    };

    walkSupport(0, 0);
    return { size, found, complete: !capped && !overBudget };
  });
}

// Returns taps-per-tile, fewest taps first, or null if this state cannot be solved.
// Verifies its own answer before handing it back, so a wrong hint is impossible.
function solve(rawTurns) {
  const state = rawTurns.map(v => mod(v, STEPS));
  const want = state.map(v => mod(-v, STEPS));
  const mod2 = solveModP(want.map(v => v % 2), 2);
  const mod3 = solveModP(want.map(v => v % 3), 3);
  if (!mod2 || !mod3) return null;

  let shortest = [];
  let fewest = Infinity;
  if (PROVABLY_FEWEST) {
    for (const a of coset(mod2)) {
      for (const b of coset(mod3)) {
        const x = combine(a, b);
        let cost = 0;
        for (const v of x) cost += v;
        if (cost < fewest) { fewest = cost; shortest = [x]; }
        else if (cost === fewest) shortest.push(x);
      }
    }
  } else {
    shortest = [combine(mod2.particular, mod3.particular)];
  }

  const best = mostSymmetric(shortest, state);
  return applyPlan(state, best).every(v => v === 0) ? best : null;
}

/* ===================== self-test ===================== */

// Two things worth asserting on load. The board's shape, because 19 seven-tile groups,
// 12 five-tile and 6 four-tile is easy to get wrong and hard to eyeball. And the
// solver, end to end: solve() verifies its own plan, so a scramble it answers at all
// is a scramble it genuinely solves.
(function selfTest() {
  const sizes = {};
  for (const g of groups) sizes[g.length] = (sizes[g.length] || 0) + 1;
  const symmetric = groups.every((g, i) => g.every(j => groups[j].indexOf(i) !== -1));
  const shapeOk = cells.length === 37 && symmetric &&
                  sizes[7] === 19 && sizes[5] === 12 && sizes[4] === 6;

  let solverOk = true;
  for (let t = 0; t < 20 && solverOk; t++) {
    const probe = cells.map(() => 0);
    for (let k = 0; k < 40; k++) {
      const i = Math.floor(Math.random() * cells.length);
      for (const j of groups[i]) probe[j]++;
    }
    solverOk = solve(probe) !== null;
  }

  // Both symmetry generators must map the board exactly onto itself, so no image may
  // fall off the board and the twelve permutations must be distinct.
  const onBoard = SYMMETRIES.every(perm => perm.every(i => i !== undefined));
  const distinct = new Set(SYMMETRIES.map(perm => perm.join(','))).size === 12;
  const symmetryOk = onBoard && distinct;

  const pass = shapeOk && solverOk && symmetryOk;
  console[pass ? 'log' : 'error'](
    '[arrow-puzzle] self-test ' + (pass ? 'PASS' : 'FAIL') +
    ': shape ' + (shapeOk ? 'ok' : 'BAD') +
    ', solver ' + (solverOk ? 'ok on 20 scrambles' : 'FAILED') +
    ', symmetries ' + (symmetryOk ? 'ok, 12 distinct' : 'BAD') +
    ', kernel dimension ' + KERNEL_2.length + ' mod 2 and ' + KERNEL_3.length + ' mod 3' +
    ', ' + SOLUTION_COUNT + ' solutions per position' +
    ' (' + (PROVABLY_FEWEST ? 'all searched, so fewest-taps is exact' : 'sampled') + ')' +
    ', 1 position in ' + SOLUTION_COUNT + ' is solvable at all');
})();

/* ===================== display ===================== */

// Hex of size 97 inside a viewBox sized for 100, so the stroke clears the clip-path
// and leaves a hairline seam. The chevron's apex points at the tile's top edge.
const VIEW_BOX = 'viewBox="-100 -86.603 200 173.205" aria-hidden="true"';
const HEX_POINTS = '97,0 48.5,-84.004 -48.5,-84.004 -97,0 -48.5,84.004 48.5,84.004';
// Sat 3 units above the geometric centre: a chevron is bottom-heavy, so its bounding
// box being centred reads as low. Units, not pixels, so it scales with the tile.
const ARROW_PATH = 'M-38 14 L0 -20 L38 14';

const HEX_SVG = '<svg ' + VIEW_BOX + '><polygon class="cell" points="' + HEX_POINTS + '"/></svg>';
const ARROW_SVG = '<svg class="spin" ' + VIEW_BOX + '><path class="arrow" d="' + ARROW_PATH + '"/></svg>';
const TILE_SVG = HEX_SVG + ARROW_SVG + '<span class="cue"></span>';

const HEADINGS = ['up', 'upper right', 'lower right', 'down', 'lower left', 'upper left'];

// Flat-top hex packing: columns sit sqrt(3)/2 of a pitch apart and step half a pitch down.
const offsetX = c => Math.sqrt(3) / 2 * c.q;
const offsetY = c => c.r + c.q / 2;

// Named the way a player counting across the screen would, not by axial coordinate.
const topOfColumn = q => Math.max(-RADIUS, -RADIUS - q);
const placeOf = c => 'column ' + (c.q + RADIUS + 1) + ', tile ' + (c.r - topOfColumn(c.q) + 1);

const board = document.getElementById('board');
const clockEl = document.getElementById('clock');
const bestEl = document.getElementById('best');
const movesEl = document.getElementById('moves');
const statusEl = document.getElementById('status');
const undoEl = document.getElementById('undo');
const cueingEl = document.getElementById('cueing');

const tiles = cells.map((c, i) => {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'tile';
  tile.style.setProperty('--x', offsetX(c));
  tile.style.setProperty('--y', offsetY(c));
  tile.style.setProperty('--dist', distanceOf(c));
  tile.innerHTML = TILE_SVG;
  tile.addEventListener('click', () => play(i, 1));
  // Preview the tiles a tap would turn.
  tile.addEventListener('pointerenter', () => setWarm(i, true));
  tile.addEventListener('pointerleave', () => setWarm(i, false));
  tile.addEventListener('focus', () => setWarm(i, true));
  tile.addEventListener('blur', () => setWarm(i, false));
  board.append(tile);
  return tile;
});

const cueEls = tiles.map(tile => tile.querySelector('.cue'));

function setWarm(i, on) {
  for (const j of groups[i]) tiles[j].classList.toggle('warm', on);
}

// Stagger the neighbours a beat behind the tapped tile so the turn ripples outward.
function setRipple(i) {
  const group = i === null ? [] : groups[i];
  tiles.forEach((tile, k) => {
    tile.style.setProperty('--delay', group.indexOf(k) > 0 ? '38ms' : '0ms');
  });
}

function draw() {
  tiles.forEach((tile, i) => {
    tile.style.setProperty('--turn', turns[i]);
    const needed = plan ? plan[i] : 0;
    tile.setAttribute('aria-label',
      placeOf(cells[i]) + ': arrow ' + HEADINGS[mod(turns[i], STEPS)] +
      (needed ? ', tap ' + needed + (needed > 1 ? ' times' : ' time') : ''));
  });
}

// Repaint with no spin, for scrambles and resets.
function drawInstantly() {
  board.classList.add('no-tween');
  draw();
  void board.offsetWidth;             // flush the new transforms before tweens come back
  board.classList.remove('no-tween');
}

/* ===================== cue ===================== */

let cueing = false;
let plan = null;
let assisted = false;           // sticky for the puzzle: peeking once forfeits the win

function refreshCue() {
  plan = cueing && !finished ? solve(turns) : null;
  let remaining = 0;
  tiles.forEach((tile, i) => {
    const needed = plan ? plan[i] : 0;
    remaining += needed;
    tile.classList.toggle('cued', needed > 0);
    // Always show the count, including 1. A highlighted tile with no number reads as
    // a different kind of thing from one with a number, rather than as "tap once".
    cueEls[i].textContent = needed > 0 ? needed : '';
  });
  return remaining;
}

function setStatus() {
  const remaining = refreshCue();
  statusEl.className = 'status';
  if (finished) {
    statusEl.textContent = assisted ? 'Solved with help.' : 'Solved.';
    statusEl.classList.add('show', assisted ? 'helped' : 'won');
  } else if (plan && remaining === 0) {
    // Solved, but not won: this is the board Reset hands back.
    statusEl.textContent = 'Solved. Build a sequence from here.';
    statusEl.classList.add('show', 'cueing');
  } else if (plan) {
    statusEl.textContent = remaining + (remaining === 1 ? ' tap' : ' taps') + ', in any order';
    statusEl.classList.add('show', 'cueing');
  } else if (cueing) {
    statusEl.textContent = 'No solution from here.';
    statusEl.classList.add('show', 'cueing');
  } else {
    statusEl.textContent = '';
  }
}

/* ===================== clock ===================== */

let startedAt = null;
let frame = null;

// Bumped to v2 to abandon records written before undo stopped counting as a win.
const BEST_KEY = 'ei-hex-game.best.v2';

const pad = (n, width) => String(n).padStart(width, '0');
const format = ms =>
  pad(Math.floor(ms / 60000), 2) + ':' + pad(Math.floor(ms / 1000) % 60, 2) + '.' + pad(Math.floor(ms) % 1000, 3);

function readBest() {
  try {
    const raw = Number(localStorage.getItem(BEST_KEY));
    return Number.isFinite(raw) && raw > 0 ? raw : null;
  } catch (e) { return null; }        // storage blocked in private mode
}

function showBest() {
  const best = readBest();
  bestEl.textContent = best === null ? '–' : format(best);
}

function runClock() {
  clockEl.textContent = format(performance.now() - startedAt);
  frame = requestAnimationFrame(runClock);
}

function startClock() {
  if (startedAt !== null) return;
  startedAt = performance.now();
  runClock();
}

function stopClock() {
  if (startedAt === null) return 0;
  cancelAnimationFrame(frame);
  const elapsed = performance.now() - startedAt;
  startedAt = null;
  clockEl.textContent = format(elapsed);
  return elapsed;
}

function resetClock() {
  cancelAnimationFrame(frame);
  startedAt = null;
  clockEl.textContent = format(0);
}

/* ===================== turn loop ===================== */

let finished = false;
let ranked = true;              // false once Reset hands back a board nobody scrambled

function play(i, direction) {
  if (finished) return;
  startClock();
  turn(i, direction);
  if (direction > 0) taps.push(i); else taps.pop();
  setRipple(i);
  // Only a forward move can win. Undoing back into a solved board is not a solve:
  // after Reset to solved, one tap plus one undo would otherwise claim a victory.
  if (direction > 0 && isSolved()) finish(); else refresh();
}

// draw() reads plan, so the cue has to be recomputed before the tiles are drawn.
function refresh() {
  setStatus();
  draw();
  movesEl.textContent = taps.length;
  undoEl.disabled = finished || taps.length === 0;
}

function finish() {
  finished = true;
  const elapsed = stopClock();
  const best = readBest();
  // Only a genuinely scrambled board solved unaided can set a record. Reset hands back
  // a board nobody scrambled, and the solver hands back the answer; neither counts.
  if (ranked && !assisted && elapsed > 0 && (best === null || elapsed < best)) {
    try { localStorage.setItem(BEST_KEY, elapsed); } catch (e) { /* private mode */ }
  }
  showBest();
  if (!assisted) board.classList.add('solved');   // no gold for a solved-for-you board
  refresh();
}

function clearFinish() {
  finished = false;
  board.classList.remove('solved');
}

/* ===================== controls ===================== */

cueingEl.addEventListener('click', () => {
  cueing = !cueing;
  if (cueing) assisted = true;    // stays set until New puzzle, so peek-then-hide still forfeits
  cueingEl.setAttribute('aria-pressed', String(cueing));
  cueingEl.textContent = cueing ? 'Hide solution' : 'Show solution';
  refresh();
});

undoEl.addEventListener('click', () => {
  if (taps.length) play(taps[taps.length - 1], -1);
});

// Reset is a workbench tool, not a win: it hands back a solved board without
// celebrating it. Turning each tile forward to its next multiple of six gets
// there in at most five steps instead of unwinding the whole game backwards.
document.getElementById('reset').addEventListener('click', () => {
  clearFinish();
  ranked = false;
  for (let i = 0; i < turns.length; i++) turns[i] = Math.ceil(turns[i] / STEPS) * STEPS;
  taps.length = 0;
  setRipple(null);
  resetClock();
  refresh();
});

document.getElementById('fresh').addEventListener('click', newPuzzle);

// No confirm() here on purpose: a modal would block the page, and the stored value is one
// local best time rather than anything you cannot simply set again.
document.getElementById('clearbest').addEventListener('click', () => {
  try { localStorage.removeItem(BEST_KEY); } catch (e) { /* private mode */ }
  showBest();
});

function newPuzzle() {
  clearFinish();
  ranked = true;
  assisted = false;
  for (let i = 0; i < turns.length; i++) turns[i] = 0;
  scramble(40);
  for (let i = 0; i < turns.length; i++) turns[i] %= STEPS;   // keep the counts small
  taps.length = 0;
  setRipple(null);
  resetClock();
  setStatus();
  drawInstantly();
  movesEl.textContent = 0;
  undoEl.disabled = true;
}

/* ===================== algorithm sheet ===================== */

// Because A is not surjective, no tap-set turns a single tile and leaves the rest alone,
// so the usual "one algorithm per piece" sheet does not exist for this puzzle. What does
// exist is a smallest solvable position, and those are the endgame cases: reduce a board
// to one of these and you are done. They compose by addition, like any linear system.

const MAX_SHEET_ENTRIES = 12;
const sheetEl = document.getElementById('sheet');
const sheetingEl = document.getElementById('sheeting');

function miniBoard(marks, klass, withArrows) {
  const mini = document.createElement('div');
  mini.className = 'mini';
  cells.forEach((c, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile' + (marks[i] ? ' ' + klass : '');
    tile.style.setProperty('--x', offsetX(c));
    tile.style.setProperty('--y', offsetY(c));
    tile.style.setProperty('--turn', marks[i] || 0);
    tile.innerHTML = HEX_SVG + (withArrows && marks[i] ? ARROW_SVG : '') +
                     (!withArrows && marks[i] ? '<span class="cue">' + marks[i] + '</span>' : '');
    mini.append(tile);
  });
  return mini;
}

const SHEET_SIZES = [1, 2, 3, 4];

function buildSheet() {
  const groups = findPatterns(SHEET_SIZES, 60, 6e6).filter(g => g.found.size);

  sheetEl.innerHTML =
    '<h2>Algorithm sheet</h2><p>Positions with up to ' + SHEET_SIZES[SHEET_SIZES.length - 1] +
    ' wrong tiles that can be solved at all, grouped by how many are wrong and ' +
    'deduplicated by the board\'s twelve symmetries. Left board is what you see, right ' +
    'board is where to tap, in any order. Nothing turns a single tile on its own, because ' +
    'A is not surjective, so these are as small as an endgame gets.</p>';

  if (!groups.length) {
    sheetEl.insertAdjacentHTML('beforeend',
      '<p>No position with ' + SHEET_SIZES[SHEET_SIZES.length - 1] +
      ' or fewer wrong tiles can be solved on this board.</p>');
    return;
  }

  for (const group of groups) {
    const entries = [...group.found.values()];
    const shown = entries.slice(0, MAX_SHEET_ENTRIES);
    const block = document.createElement('section');
    const count = (group.complete ? '' : 'at least ') + entries.length;
    block.innerHTML =
      '<h3>' + group.size + (group.size === 1 ? ' wrong tile' : ' wrong tiles') + ' &middot; ' +
      count + (entries.length === 1 ? ' case' : ' cases') +
      (group.complete ? ' (complete)' : ' (search stopped early)') +
      (entries.length > shown.length ? ', showing ' + shown.length : '') +
      '</h3><div class="algos"></div>';
    const grid = block.querySelector('.algos');

    shown.forEach((pattern, n) => {
      const algo = solve(pattern);
      const figure = document.createElement('figure');
      figure.className = 'algo';
      const pair = document.createElement('div');
      pair.className = 'pair';
      pair.append(miniBoard(pattern, 'off', true), miniBoard(algo || [], 'cued', false));
      const caption = document.createElement('figcaption');
      const taps = algo ? algo.reduce((sum, v) => sum + v, 0) : 0;
      caption.textContent = algo
        ? 'case ' + (n + 1) + ' · ' + taps + ' taps'
        : 'case ' + (n + 1) + ' · unsolvable, which should be impossible here';
      figure.append(pair, caption);
      grid.append(figure);
    });

    sheetEl.append(block);
  }
}

let sheetBuilt = false;
sheetingEl.addEventListener('click', () => {
  const opening = sheetEl.hidden;
  if (opening && !sheetBuilt) { buildSheet(); sheetBuilt = true; }
  sheetEl.hidden = !opening;
  sheetingEl.setAttribute('aria-pressed', String(opening));
  // Has to follow unhiding: you cannot scroll to a display:none element.
  if (opening) {
    const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    sheetEl.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  }
});

showBest();
newPuzzle();
</script>

</body>
</html>
